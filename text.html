<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UT System Campuses (Text)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Plain-text, screen-reader-friendly version of the UT System Campuses story map.">
<style>
  :root { --ut-orange: #FF8200; --ink: #222; --muted: #58595B; --bg: #fff; --rule: #e3e3e3; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eee; --muted: #b8b8b8; --bg: #161616; --rule: #333; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--ut-orange); }
  .back { font: 15px system-ui, sans-serif; }
  h1 { font: 700 2rem/1.2 system-ui, sans-serif; border-bottom: 4px solid var(--ut-orange); padding-bottom: 8px; }
  h2 { font: 700 1.35rem/1.3 system-ui, sans-serif; margin: 0 0 4px; }
  .year { font: 600 0.9rem system-ui, sans-serif; color: var(--ut-orange); letter-spacing: .04em; text-transform: uppercase; }
  section { border-top: 1px solid var(--rule); padding-top: 24px; margin-top: 24px; }
  figure { margin: 12px 0; }
  img { max-width: 100%; height: auto; border-radius: 4px; }
  figcaption { font: 14px/1.4 system-ui, sans-serif; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<main>
  <p class="back"><a href="index.html">&larr; Back to the interactive map</a></p>
  <div id="story"><p>Loading…</p></div>
</main>
<script>
  fetch('storymap.json').then(function (r) { return r.json(); }).then(function (data) {
    var out = '';
    data.storymap.slides.forEach(function (s, i) {
      var t = s.text || {}, m = s.media || {};
      var head = i === 0 ? '<h1>' + t.headline + '</h1>' : '<h2>' + t.headline + '</h2>';
      var body = (s.date ? '<div class="year">' + s.date + '</div>' : '') + head;
      if (m.url) {
        body += '<figure><img src="' + m.url + '" alt="' + (m.caption || '').replace(/"/g, '&quot;') + '" loading="lazy">' +
                '<figcaption>' + (m.caption || '') + (m.credit ? ' — ' + m.credit : '') + '</figcaption></figure>';
      }
      body += t.text || '';
      out += i === 0 ? body : '<section>' + body + '</section>';
    });
    document.getElementById('story').innerHTML = out.replace(/<a href="text\.html">[^<]*<\/a>/, '<a href="index.html">View the interactive map</a>');
  }).catch(function () {
    document.getElementById('story').innerHTML = '<p>Sorry, the story could not be loaded.</p>';
  });
</script>
</body>
</html>
